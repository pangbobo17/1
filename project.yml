name: LyricSync
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
packages:
  LyricsAlignCore:
    path: Packages/LyricsAlignCore
targets:
  LyricSync:
    type: application
    platform: iOS
    sources: [App/LyricSync]
    scheme: {}
    dependencies:
      - package: LyricsAlignCore
    info:
      path: App/LyricSync/Info.plist
      properties:
        CFBundleDisplayName: 歌词对齐
        UILaunchScreen: {}
        NSSpeechRecognitionUsageDescription: 用于识别音频中的歌词并生成时间轴，识别在本机完成。
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
