name: LyricSync
options:
  bundleIdPrefix: com.pangbobo17
  deploymentTarget:
    iOS: "26.0"
packages:
  LyricsAlignCore:
    path: Packages/LyricsAlignCore
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: 1.1.0
targets:
  LyricSync:
    type: application
    platform: iOS
    sources: [App/LyricSync]
    scheme: {}
    dependencies:
      - package: LyricsAlignCore
      - package: WhisperKit
        product: WhisperKit
    info:
      path: App/LyricSync/Info.plist
      properties:
        CFBundleDisplayName: 歌词对齐
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pangbobo17.lyricsync
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
