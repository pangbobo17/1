name: Niannian (Expo)

on:
  push:
    paths: ['niannian-app/**', '.github/workflows/niannian-app.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: niannian-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: niannian-app/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Bundle for iOS and Android
        run: npx expo export --platform ios --platform android --output-dir /tmp/export
        env:
          EXPO_OFFLINE: 1
