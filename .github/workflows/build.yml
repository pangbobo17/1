name: Build

on:
  push:
    paths: ['App/**', 'Packages/**', 'project.yml', '.github/workflows/build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Test alignment core
        run: swift test --package-path Packages/LyricsAlignCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen

      - name: Build app (simulator, unsigned)
        run: |
          status=0
          xcodebuild -project LyricSync.xcodeproj -scheme LyricSync \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log || tail -50 build.log
          exit $status
